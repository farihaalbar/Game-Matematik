
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geng Matematik: Perpuluhan Tahun 5</title>
    <style>
        :root {
            --bg-color: #f0faff;
            --card-color: #ffffff;
            --primary-color: #4a90e2;
            --secondary-color: #ffcc5c;
            --accent-color: #ff6f69;
            --success-color: #88d8b0;
            --text-color: #2c3e50;
            --shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Poppins', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            background-color: var(--card-color);
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: var(--shadow);
            text-align: center;
            position: relative;
            border: 4px solid var(--primary-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 20px;
        }

        .question-box {
            background-color: #eef6ff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 25px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: var(--card-color);
            border: 3px solid #d0e4ff;
            border-radius: 15px;
            padding: 15px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .option-btn.correct {
            background-color: var(--success-color);
            border-color: #55b883;
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--accent-color);
            border-color: #d9534f;
            color: white;
        }

        #end-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-restart {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="quiz-screen">
        <div class="header">
            <span id="question-number">Soalan 1/15</span>
            <span id="score-display">Markah: 0</span>
        </div>
        
        <div class="question-box" id="question-text">
            Loading...
        </div>

        <div class="options-grid" id="options-container">
            <!-- Butang jawapan akan keluar di sini -->
        </div>
    </div>

    <div id="end-screen">
        <h2>🎉 Tahniah! 🎉</h2>
        <p id="final-score" style="font-size: 1.3rem; font-weight: bold;"></p>
        <button class="btn-restart" onclick="restartGame()">Main Lagi 🔄</button>
    </div>
</div>

<script>
    const questions = [
        { q: "0.4 + 0.3 = ?", options: ["0.7", "0.8", "0.1", "1.1"], answer: "0.7" },
        { q: "1.2 + 2.5 = ?", options: ["3.5", "3.7", "4.7", "3.8"], answer: "3.7" },
        { q: "0.9 - 0.4 = ?", options: ["0.5", "0.4", "0.6", "1.3"], answer: "0.5" },
        { q: "5.8 - 2.3 = ?", options: ["3.2", "3.4", "3.5", "3.6"], answer: "3.5" },
        { q: "0.3 × 2 = ?", options: ["0.5", "0.6", "0.9", "6.0"], answer: "0.6" },
        { q: "1.4 × 2 = ?", options: ["2.6", "2.8", "3.0", "1.6"], answer: "2.8" },
        { q: "0.8 ÷ 2 = ?", options: ["0.2", "0.4", "0.6", "0.8"], answer: "0.4" },
        { q: "4.6 ÷ 2 = ?", options: ["2.3", "2.1", "2.4", "1.3"], answer: "2.3" },
        { q: "0.25 + 0.14 = ?", options: ["0.39", "0.49", "0.38", "0.29"], answer: "0.39" },
        { q: "0.75 - 0.25 = ?", options: ["0.50", "0.40", "0.55", "0.20"], answer: "0.50" },
        { q: "3.15 + 1.20 = ?", options: ["4.35", "4.25", "4.45", "5.35"], answer: "4.35" },
        { q: "9.6 - 4.1 = ?", options: ["5.5", "5.4", "5.6", "4.5"], answer: "5.5" },
        { q: "0.5 × 10 = ?", options: ["0.05", "5", "50", "0.5"], answer: "5" },
        { q: "2.4 ÷ 10 = ?", options: ["0.24", "2.40", "24", "0.024"], answer: "0.24" },
        { q: "0.12 × 3 = ?", options: ["0.24", "0.36", "0.48", "0.32"], answer: "0.36" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const questionNumber = document.getElementById('question-number');
    const scoreDisplay = document.getElementById('score-display');
    const quizScreen = document.getElementById('quiz-screen');
    const endScreen = document.getElementById('end-screen');
    const finalScore = document.getElementById('final-score');

    function startGame() {
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplay.textContent = `Markah: ${score}`;
        quizScreen.style.display = 'block';
        endScreen.style.display = 'none';
        loadQuestion();
    }

    function loadQuestion() {
        const q = questions[currentQuestionIndex];
        questionNumber.textContent = `Soalan ${currentQuestionIndex + 1}/${questions.length}`;
        questionText.textContent = q.q;
        optionsContainer.innerHTML = '';

        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(btn, opt);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, selectedOpt) {
        const currentAnswer = questions[currentQuestionIndex].answer;
        const allBtns = optionsContainer.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selectedOpt === currentAnswer) {
            selectedBtn.classList.add('correct');
            score += 10;
            scoreDisplay.textContent = `Markah: ${score}`;
        } else {
            selectedBtn.classList.add('wrong');
            allBtns.forEach(b => {
                if (b.textContent === currentAnswer) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                showEndScreen();
            }
        }, 1200);
    }

    function showEndScreen() {
        quizScreen.style.display = 'none';
        endScreen.style.display = 'flex';
        finalScore.textContent = `Kamu berjaya mendapat ${score} / 150 markah!`;
    }

    function restartGame() {
        startGame();
    }

    startGame();
</script>

</body>
</html>
